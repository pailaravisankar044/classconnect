services:
  classconnect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classconnect_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=classconnect_production_jwt_secret_2026_change_me
      - DB_PATH=/app/data/classconnect.db
      - UPLOAD_DIR=/app/uploads/materials
      - DEFAULT_ATTENDANCE_THRESHOLD=75
    volumes:
      - classconnect_data:/app/data
      - classconnect_uploads:/app/uploads

volumes:
  classconnect_data:
    driver: local
  classconnect_uploads:
    driver: local
